name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore persistent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.TAGDECK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "::error::The TAGDECK_DEBUG_KEYSTORE_BASE64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > app/debug.keystore
          test -s app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and name APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify "$APK"
          cp "$APK" TagDeck.apk

      - name: Package source code
        run: git archive --format=zip --output=TagDeckLauncher-source.zip HEAD

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TagDeckLauncher-${{ github.run_number }}
          path: |
            TagDeck.apk
            TagDeckLauncher-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TagDeckLauncher build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            TagDeck.apk
            TagDeckLauncher-source.zip
          fail_on_unmatched_files: true
