name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Package source code ZIP
        run: git archive --format=zip --output=TagDeckLauncher-source.zip HEAD

      - name: Upload APK and source ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TagDeckLauncher-build
          path: |
            app/build/outputs/apk/debug/*.apk
            TagDeckLauncher-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK and source ZIP downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest TagDeckLauncher APK
          body: "Automatically updated installable APK and complete tracked source-code ZIP from the latest successful push to main."
          files: |
            app/build/outputs/apk/debug/*.apk
            TagDeckLauncher-source.zip
          overwrite_files: true
          make_latest: true
