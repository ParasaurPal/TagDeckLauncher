name: TagDeck First Beta APK

on:
  workflow_dispatch:
  push:
    branches: [merge/unified-launcher]

permissions:
  contents: read

concurrency:
  group: tagdeck-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-apk:
    name: Build installable beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out beta source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create temporary beta signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TagDeck Beta, OU=Development, O=TagDeck, L=Unknown, ST=Unknown, C=US"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build beta APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify "$APK"
          cp "$APK" TagDeck-Beta.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TagDeck-Beta-${{ github.run_number }}
          path: TagDeck-Beta.apk
          if-no-files-found: error
          retention-days: 30
